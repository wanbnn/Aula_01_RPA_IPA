[project]
name = "browser-mcp-server"
version = "0.1.0"
description = "FastMCP server for autonomous browser automation with Playwright."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0",
    "playwright>=1.52.0",
]

[project.scripts]
browser-mcp = "browser_server:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["browser_server.py"]
